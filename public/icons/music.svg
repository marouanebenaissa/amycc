<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Left Notehead (Solid Oval, Angled) -->
  <ellipse cx="20" cy="46" rx="7" ry="5.5" transform="rotate(-20 20 46)" fill="currentColor"/>
  <!-- Right Notehead (Solid Oval, Angled) -->
  <ellipse cx="44" cy="38" rx="7" ry="5.5" transform="rotate(-20 44 38)" fill="currentColor"/>
  
  <!-- Left Stem -->
  <path d="M25 44V16" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right Stem -->
  <path d="M49 36V10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Top Connecting Musical Beams (Double Beam) -->
  <path d="M25 16l24-6v6l-24 6z" fill="#ffd22f"/>
  <path d="M25 16l24-6" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M25 24l24-6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Acoustic Sound Radiance -->
  <path d="M53 22c3 2 5 6 5 10" stroke="#d2a82b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M57 18c5 3 8 9 8 15" stroke="#d2a82b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 3"/>
  
  <!-- Harmony Sparkle -->
  <circle cx="12" cy="22" r="2" fill="#ffd22f"/>
</svg>
